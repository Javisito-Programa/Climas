<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="caseDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="protectorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0062CC" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="24" fill="#F4F7FA"/>
  <circle cx="200" cy="200" r="140" fill="radial-gradient(circle, rgba(34,197,94,0.15), transparent 70%)"/>

  <g filter="url(#protectorShadow)">
    <!-- Main Device Case -->
    <rect x="120" y="70" width="160" height="260" rx="18" fill="url(#caseDark)" stroke="#334155" stroke-width="2"/>

    <!-- Mounting Ears Top & Bottom -->
    <path d="M 180 50 L 220 50 L 210 70 L 190 70 Z" fill="#334155"/>
    <circle cx="200" cy="58" r="4" fill="#E2E8F0"/>
    <path d="M 190 330 L 210 330 L 220 350 L 180 350 Z" fill="#334155"/>
    <circle cx="200" cy="342" r="4" fill="#E2E8F0"/>

    <!-- Brand Header -->
    <rect x="140" y="88" width="120" height="24" rx="6" fill="#0062CC"/>
    <text x="200" y="104" font-family="'Sora', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PROTECTOR CFE</text>

    <!-- Digital Volt Display (Green 7-Segment Style) -->
    <rect x="145" y="125" width="110" height="55" rx="8" fill="#050C16" stroke="#00D2FF" stroke-width="1.5"/>
    <text x="188" y="164" font-family="'IBM Plex Mono', monospace" font-size="34" font-weight="700" fill="#22C55E">220</text>
    <text x="240" y="162" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#22C55E">V</text>

    <!-- Status LEDs with Labels -->
    <!-- LED 1: Normal -->
    <circle cx="150" cy="210" r="6" fill="#22C55E" stroke="#86EFAC" stroke-width="2"/>
    <text x="165" y="214" font-family="'Sora', sans-serif" font-size="9" font-weight="700" fill="#CBD5E1">NORMAL (OK)</text>

    <!-- LED 2: Espera -->
    <circle cx="150" cy="235" r="5" fill="#EAB308"/>
    <text x="165" y="239" font-family="'Sora', sans-serif" font-size="9" font-weight="600" fill="#94A3B8">CICLO ESPERA</text>

    <!-- LED 3: Falla / Sobrevoltaje -->
    <circle cx="150" cy="260" r="5" fill="#EF4444"/>
    <text x="165" y="264" font-family="'Sora', sans-serif" font-size="9" font-weight="600" fill="#94A3B8">CORTE VOLTAJE</text>

    <!-- Spec Tag -->
    <rect x="140" y="285" width="120" height="22" rx="6" fill="#1E293B" stroke="#00D2FF" stroke-width="1"/>
    <text x="200" y="299" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700" fill="#38BDF8" text-anchor="middle">220V BIFÁSICO · 30A</text>
  </g>
</svg>
