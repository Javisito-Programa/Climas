<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="freezerWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="chestShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="24" fill="#F4F7FA"/>
  <circle cx="200" cy="200" r="145" fill="radial-gradient(circle, rgba(0,184,255,0.2), transparent 70%)"/>

  <g filter="url(#chestShadow)">
    <!-- Main Chest Body -->
    <rect x="70" y="110" width="260" height="190" rx="14" fill="url(#freezerWhite)" stroke="#94A3B8" stroke-width="2"/>

    <!-- Hinged Lid -->
    <rect x="66" y="85" width="268" height="35" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    
    <!-- Heavy Duty Handle with Key Lock -->
    <rect x="160" y="105" width="80" height="18" rx="5" fill="#1E293B" stroke="#00D2FF" stroke-width="1.5"/>
    <circle cx="200" cy="114" r="3.5" fill="#E2E8F0"/>

    <!-- Mirage Brand Badge -->
    <rect x="95" y="140" width="70" height="22" rx="4" fill="#FFFFFF" stroke="#EF4444" stroke-width="1"/>
    <text x="130" y="155" font-family="'Sora', sans-serif" font-size="9" font-weight="900" fill="#EF4444" text-anchor="middle" letter-spacing="1">MIRAGE</text>

    <!-- Specs Badge -->
    <rect x="95" y="170" width="105" height="18" rx="9" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
    <text x="147" y="182" font-family="'Sora', sans-serif" font-size="8" font-weight="700" fill="#0369A1" text-anchor="middle">7 PIES · DUAL FREEZE</text>

    <!-- Temperature Controller Pod (Bottom Right) -->
    <rect x="250" y="240" width="60" height="45" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="280" cy="258" r="9" fill="#00D2FF" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="280" cy="258" r="3" fill="#0F172A"/>
    <text x="280" y="278" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="700" fill="#22C55E" text-anchor="middle">-18°C POLAR</text>

    <!-- Cooling Vents on Right Side -->
    <line x1="260" y1="215" x2="300" y2="215" stroke="#94A3B8" stroke-width="2"/>
    <line x1="260" y1="222" x2="300" y2="222" stroke="#94A3B8" stroke-width="2"/>
    <line x1="260" y1="229" x2="300" y2="229" stroke="#94A3B8" stroke-width="2"/>

    <!-- Castor Wheels / Feet -->
    <rect x="85" y="298" width="20" height="14" rx="4" fill="#334155"/>
    <rect x="295" y="298" width="20" height="14" rx="4" fill="#334155"/>
  </g>
</svg>
