<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan gradient for the G and ice elements -->
    <linearGradient id="gh-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0077CC"/>
    </linearGradient>

    <!-- Deep Navy / Cobalt gradient for the H -->
    <linearGradient id="gh-navy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F2B5C"/>
      <stop offset="100%" stop-color="#0B1E3F"/>
    </linearGradient>

    <!-- Breeze wind stream gradient -->
    <linearGradient id="gh-breeze-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#7DD3FC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0"/>
    </linearGradient>

    <!-- Snowflake gradient -->
    <linearGradient id="gh-snow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <filter id="gh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00D2FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- === EMBLEM ICON (Left) === -->
  <g transform="translate(10, 5)">
    <!-- Letter G outer curve with stylized snowflake inner cutout -->
    <path d="M 52 14 C 28 14 10 32 10 56 C 10 80 28 98 52 98 C 72 98 88 84 92 65 L 75 65 C 72 75 62 82 52 82 C 37 82 26 70 26 56 C 26 42 37 30 52 30 C 64 30 73 37 77 47 L 93 41 C 86 25 70 14 52 14 Z" 
          fill="url(#gh-cyan-grad)" filter="url(#gh-glow)"/>

    <!-- Integrated Snowflake Crystal inside the G crescent -->
    <g stroke="url(#gh-snow-grad)" stroke-width="2.2" stroke-linecap="round" opacity="0.95">
      <!-- Main snowflake axis 1 (horizontal) -->
      <line x1="22" y1="56" x2="48" y2="56"/>
      <line x1="32" y1="56" x2="27" y2="51"/>
      <line x1="32" y1="56" x2="27" y2="61"/>
      <!-- Main snowflake axis 2 (60 deg) -->
      <line x1="28" y1="42" x2="44" y2="70"/>
      <line x1="33" y1="51" x2="27" y2="49"/>
      <line x1="33" y1="51" x2="35" y2="45"/>
      <!-- Main snowflake axis 3 (-60 deg) -->
      <line x1="28" y1="70" x2="44" y2="42"/>
      <line x1="33" y1="61" x2="27" y2="63"/>
      <line x1="33" y1="61" x2="35" y2="67"/>
      <!-- Center node -->
      <circle cx="36" cy="56" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- Letter H (Deep Navy Blue) -->
    <g fill="url(#gh-navy-grad)" stroke="#1D4ED8" stroke-width="0.75">
      <!-- Left pillar of H -->
      <rect x="70" y="24" width="14" height="64" rx="2.5"/>
      <!-- Right pillar of H -->
      <rect x="98" y="24" width="14" height="64" rx="2.5"/>
      <!-- Base bar of H -->
      <rect x="80" y="51" width="22" height="10" rx="1"/>
    </g>

    <!-- 3 Aerodynamic Cool Wind Streams swooshing through the H into the right -->
    <!-- Top stream -->
    <path d="M 64 47 C 80 47, 90 44, 108 44 C 120 44, 134 46, 148 43" 
          stroke="url(#gh-breeze-grad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Middle main stream -->
    <path d="M 58 56 C 76 56, 92 53, 116 53 C 132 53, 146 56, 162 52" 
          stroke="url(#gh-breeze-grad)" stroke-width="3.6" stroke-linecap="round" filter="url(#gh-glow)"/>
    <!-- Bottom stream -->
    <path d="M 66 65 C 82 65, 96 62, 114 62 C 128 62, 138 65, 150 63" 
          stroke="url(#gh-breeze-grad)" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- === TYPOGRAPHY (Right) === -->
  <g transform="translate(172, 15)">
    <!-- Main Title: GH SERVICIOS TÉCNICOS -->
    <text x="0" y="38" font-family="'Sora', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="27" letter-spacing="0.02em" fill="#FFFFFF">
      GH <tspan fill="#38BDF8">SERVICIOS</tspan> TÉCNICOS
    </text>

    <!-- Subtitle: Venta de equipos, instalación y mantenimiento -->
    <text x="0" y="58" font-family="'Sora', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="11.5" letter-spacing="0.05em" fill="#7DD3FC">
      VENTA DE EQUIPOS · INSTALACIÓN Y MANTENIMIENTO
    </text>

    <!-- Slogan / Guarantee Badge -->
    <g transform="translate(0, 68)">
      <rect x="0" y="2" width="236" height="18" rx="4" fill="rgba(0, 210, 255, 0.08)" stroke="rgba(0, 210, 255, 0.25)" stroke-width="1"/>
      <circle cx="9" cy="11" r="3.5" fill="#25D366"/>
      <text x="18" y="14.5" font-family="'Sora', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="9" letter-spacing="0.07em" fill="#E0F2FE">
        TÉCNICO ESPECIALISTA · SERVICIO GARANTIZADO
      </text>
    </g>
  </g>
</svg>
